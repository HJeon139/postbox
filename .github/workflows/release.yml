# Releases what each merge to main brings (designs/engineering-practices.md, “Commits and versions”): npm run release
# writes the release commit and its tag, and this pushes both to main with the repository’s `release` deploy key. Its
# private half is the secret RELEASE_DEPLOY_KEY in the `release` environment, which only main may use, so a pull
# request’s workflow can’t read it. Deploy keys go on the protect-main ruleset’s bypass list, so once main requires pull
# requests and checks, the release commit is still the one change that reaches main without them.
name: release

on:
  push:
    branches: [main]

# The deploy key pushes; the workflow’s own token only reads.
permissions:
  contents: read

# One release at a time. A merge that lands while one runs is released by the next run, which starts from main’s tip.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release what’s merged
    runs-on: ubuntu-latest
    # Where RELEASE_DEPLOY_KEY lives: an environment limited to main.
    environment: release
    # A push with the deploy key starts workflows, so this skips the release commit it pushed itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # main’s tip, not the commit that started this run: a later merge may have landed meanwhile.
          ref: main
          # The whole history and its tags: the next version comes from the commits since the last tag.
          fetch-depth: 0
          # Checked out over SSH with the deploy key, so the push below uses it too.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tools/release.mjs uses only Node’s own modules, so nothing is installed.
      - name: Make the release commit and its tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/release.mjs
      # --atomic: the commit and the tag go up together, or neither does.
      - name: Push them to main
        run: |
          tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*')"
          if [ -z "$tag" ]; then echo 'Nothing to release.'; exit 0; fi
          git push --atomic origin HEAD:main "$tag"
      - name: Every change on main is released
        run: node tools/release.mjs --check
