# Refuses a pull request that adds or changes a dependency with a known vulnerability, moderate or worse, whether it
# ships or is only used to develop Postbox. See designs/architecture/code-quality.md, “Code quality”. It compares GitHub’s
# dependency graph of the base and the head, so it checks out and runs nothing from the pull request.
name: dependency-review

on:
  pull_request:
  # Its check is required, so it runs on each merge group of GitHub’s merge queue too (check.yml).
  merge_group:

permissions:
  contents: read

# A new push to a pull request replaces its run still in progress, as in check.yml. A merge group has no pull request
# number, so each gets a group of its own: keyed on the number alone, every group shared one and cancelled the last.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: No new dependency with a known vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Development dependencies too: they run on contributors’ machines and in CI.
          fail-on-scopes: runtime, development
          # No OpenSSF Scorecard lookups: they call deps.dev for each new package, and an outage there would fail this check
          # on a clean pull request.
          show-openssf-scorecard: false
          # A merge group compares its base on main with its head. The action takes these from a merge_group event by
          # itself at this version (src/git-refs.ts), though its action.yml says they must be given; named here so an
          # update that drops that stays correct. Empty on a pull request, where it takes the pull request’s own.
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}
