# Runs Postbox’s checks on every pull request and every push to main. See designs/architecture.md, “Code quality”.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run still in progress. Keyed on the pull request’s number, not its branch’s
# name, so two forks' branches of the same name don't cancel each other. A push to main gets a group of its own.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, project rules and tests
    runs-on: ubuntu-latest
    # It takes under a minute; a hung step would otherwise hold the runner for GitHub’s default of 360.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: commit messages are checked against the base, and versions against tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install scripts are skipped: the checks need no native builds, and the optional narration
      # packages would otherwise download models and binaries they don't use here.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Conventional Commits, from v0.2.0 on: older commits on long-running branches keep their plain messages.
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        # Through the environment, not written into the script, as GitHub’s security guide says for context values.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/lint-commits.mjs "origin/$BASE_REF..HEAD" --since "$(git log -1 --format=%cI v0.2.0)"

  end-to-end:
    name: Demo in Chrome, with accessibility checks
    runs-on: ubuntu-latest
    needs: check
    # About 11 minutes on this runner (#287), when the old headless checks ran beside the specs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The browser specs on Playwright Test (#303), on the Chromium build its version pins. They include the demo’s
      # accessibility gate: axe-core on every scene, at 1280 and 375 px in both themes (tests/browser/demo-a11y.spec.mjs).
      - name: Install Playwright’s Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser specs
        run: npx playwright test
      - name: Browser specs, with the server’s events late
        if: success() || failure()
        run: npx playwright test
        env:
          POSTBOX_STREAM_LAG: 300
      # Pictures of every scene for the reviewer, not a check: the spec above is the gate, so a screenshot tool that
      # breaks warns here and doesn’t fail the job.
      - name: Play the demo and screenshot every scene
        if: success() || failure()
        continue-on-error: true
        run: CHROME="$(command -v google-chrome)" node tools/shoot-app.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/latest/app/
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: check-logs/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # A spec a pull request adds or changes runs ten times, with the events late, before it counts: one failure fails it.
  # A job of its own, beside the end-to-end one: a change to a helper every spec imports (tests/browser/postbox.mjs)
  # makes --only-changed run every spec ten times, about 25 minutes on this runner (#365).
  repeat:
    name: New and changed specs, ten times
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch too, for the specs a pull request adds or changes (--only-changed, below).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright’s Chromium
        run: npx playwright install --with-deps chromium
      - name: New and changed specs, ten times
        run: npx playwright test --only-changed="origin/$BASE_REF" --repeat-each=10 --pass-with-no-tests
        env:
          BASE_REF: ${{ github.base_ref }}
          POSTBOX_STREAM_LAG: 300
          # Its own report, beside the lag pass’s in the end-to-end job (#317).
          PB_REPORT: check-logs/lag/playwright-repeat.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-repeat
          path: check-logs/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-repeat
          path: test-results/
          retention-days: 14
