# Runs Postbox’s checks on every pull request and every push to main. See designs/architecture.md, “Code quality”.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run still in progress. Keyed on the pull request’s number, not its branch’s
# name, so two forks' branches of the same name don't cancel each other. A push to main gets a group of its own.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, project rules and tests
    runs-on: ubuntu-latest
    # It takes under a minute; a hung step would otherwise hold the runner for GitHub’s default of 360.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: commit messages are checked against the base, and versions against tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install scripts are skipped: the checks need no native builds, and the optional narration
      # packages would otherwise download models and binaries they don't use here.
      - run: npm ci --ignore-scripts
      # The process tests drive the UAT runner's Chromium (tools/browser.mjs): Playwright's headless shell, which is
      # all they need of its Chromium build.
      - name: Install Playwright’s headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      # The store’s Redis (tests/AGENTS.md, “The store’s Redis”): the runner has none, and tests never touch the network, so
      # Postbox’s pinned build comes from its own release through the code first start runs (tools/redis-ci.mjs): kept
      # only once its SHA-256 matches server/redis-build.mjs, unpacked in Node, and named in POSTBOX_REDIS_HOME. The
      # verified archive is cached under its pinned SHA-256, so a run downloads it only when the pin changes, and the
      # cached file is hashed again before it’s unpacked. The build came from ubuntu-24.04, so it runs on this image.
      - name: Read the Redis pin
        id: redis
        run: node tools/redis-ci.mjs pin >> "$GITHUB_OUTPUT"
      - name: Cache the verified Redis archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/postbox-redis/redis/${{ steps.redis.outputs.version }}/${{ steps.redis.outputs.asset }}
          key: redis-${{ steps.redis.outputs.target }}-${{ steps.redis.outputs.sha256 }}
      - name: Verify and unpack Redis
        run: node tools/redis-ci.mjs prepare "$RUNNER_TEMP/postbox-redis"
      - run: npm run check
      # Conventional Commits, from v0.2.0 on: older commits on long-running branches keep their plain messages.
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        # Through the environment, not written into the script, as GitHub’s security guide says for context values.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/lint-commits.mjs "origin/$BASE_REF..HEAD" --since "$(git log -1 --format=%cI v0.2.0)"

  # Whether a pull request changes only docs, which no browser spec reads: then the browser jobs and the ten-times job
  # are skipped. A docs-only pull request of two files under designs/ ran the whole demo job, and failed on a timeout
  # flake after 31 minutes. The personas in server/personas/ are Markdown the server reads, so they aren’t docs here.
  changes:
    name: Whether the change is docs only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # The base branch too, to tell what the pull request changed.
          fetch-depth: 0
      - name: Tell whether every changed file is a doc
        id: diff
        # Through the environment, not written into the script, as GitHub’s security guide says for context values.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A push to main runs everything; so does a pull request that changes nothing git can name.
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  server/personas/*) docs_only=false ;;
                  designs/* | LICENSE | *.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
            fi
            printf 'Changed files:\n%s\n' "$files"
          fi
          echo "Docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The browser specs on Playwright Test (#303), on the Chromium build its version pins. They include the demo’s
  # accessibility gate: axe-core on every scene, at 1280 and 375 px in both themes (tests/browser/demo-a11y.spec.mjs).
  # Every spec runs twice, normally and with the server’s events 300 ms late. One after the other in one job, the two
  # passes took 709 and 801 s, and the job 19 to 30 minutes, the longest wait on every pull request. Here each pass is
  # split three ways by spec file (Playwright’s --shard), and the demo’s accessibility spec runs on two runners of its
  # own, two of its four groups each. Playwright shards by how many tests, in file order, so the four groups all fell in
  # the first third: there they took 95 to 204 s, as their axe checks shared four cores, and the shard 378 s, while the
  # other two took 149 to 219 s. All ten run at once, each on its own runner.
  browser-specs:
    name: Browser specs (${{ matrix.pass }}, ${{ startsWith(matrix.shard, 'demo') && matrix.shard || format('{0}/3', matrix.shard) }})
    needs: [check, changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # A third of a pass is about four minutes of specs, after about two of setup.
    timeout-minutes: 20
    strategy:
      # A failing shard doesn’t cancel the others, so one run reports every failure.
      fail-fast: false
      matrix:
        pass: [plain, late]
        shard: [1, 2, 3, demo-1, demo-2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright’s Chromium
        run: npx playwright install --with-deps chromium
      # The store’s Redis (tests/AGENTS.md, “The store’s Redis”): the runner has none, and tests never touch the network, so
      # Postbox’s pinned build comes from its own release through the code first start runs (tools/redis-ci.mjs): kept
      # only once its SHA-256 matches server/redis-build.mjs, unpacked in Node, and named in POSTBOX_REDIS_HOME. The
      # verified archive is cached under its pinned SHA-256, so a run downloads it only when the pin changes, and the
      # cached file is hashed again before it’s unpacked. The build came from ubuntu-24.04, so it runs on this image.
      - name: Read the Redis pin
        id: redis
        run: node tools/redis-ci.mjs pin >> "$GITHUB_OUTPUT"
      - name: Cache the verified Redis archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/postbox-redis/redis/${{ steps.redis.outputs.version }}/${{ steps.redis.outputs.asset }}
          key: redis-${{ steps.redis.outputs.target }}-${{ steps.redis.outputs.sha256 }}
      - name: Verify and unpack Redis
        run: node tools/redis-ci.mjs prepare "$RUNNER_TEMP/postbox-redis"
      - name: Browser specs
        # Half the demo’s groups, or a third of the other specs.
        run: |
          case "$SHARD" in
            demo-*) npx playwright test demo-a11y --shard="${SHARD#demo-}/2" ;;
            *) npx playwright test --shard="$SHARD/3" --grep-invert 'demo-a11y\.spec' ;;
          esac
        env:
          SHARD: ${{ matrix.shard }}
          # Empty for the plain pass, which the server reads as no lag. It also picks the report’s file in check-logs/
          # (playwright.config.mjs); each shard uploads its own copy, below.
          POSTBOX_STREAM_LAG: ${{ matrix.pass == 'late' && '300' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.pass }}-${{ matrix.shard }}
          path: check-logs/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.pass }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The one check that says whether every browser spec passed, under the name the protect-main ruleset requires. It
  # passes too where the specs were skipped because the pull request changes only docs.
  end-to-end:
    name: Demo in Chrome, with accessibility checks
    # Always, so it reports a result: a required check that never runs leaves a pull request waiting.
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, browser-specs]
    timeout-minutes: 5
    steps:
      - name: Every browser spec shard passed
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          SPECS: ${{ needs.browser-specs.result }}
        run: |
          if [ "$SPECS" = success ]; then echo "Every shard of both passes passed."; exit 0; fi
          if [ "$CHANGES" = success ] && [ "$DOCS_ONLY" = true ] && [ "$SPECS" = skipped ]; then
            echo "Docs only: no browser spec reads them, so none ran."; exit 0
          fi
          echo "::error::The browser specs’ result is “$SPECS”. Open the failed “Browser specs” job for its log, and its playwright-traces artifact."
          exit 1

  # Pictures of every scene for the reviewer, not a check: the specs above are the gate, so a screenshot tool that
  # breaks warns here and doesn’t fail the run. Only on main, whose copy stands in for committed screenshots
  # (designs/developing.md, “Screenshots”): on a pull request nobody read them, and they cost 253 s a run.
  screenshots:
    name: Play the demo and screenshot every scene
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright’s Chromium
        run: npx playwright install --with-deps chromium
      # The store’s Redis (tests/AGENTS.md, “The store’s Redis”): the demo starts a Postbox, whose store would otherwise
      # download its Redis from the network; the same pinned, verified build as the check job, from the same cache.
      - name: Read the Redis pin
        id: redis
        run: node tools/redis-ci.mjs pin >> "$GITHUB_OUTPUT"
      - name: Cache the verified Redis archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/postbox-redis/redis/${{ steps.redis.outputs.version }}/${{ steps.redis.outputs.asset }}
          key: redis-${{ steps.redis.outputs.target }}-${{ steps.redis.outputs.sha256 }}
      - name: Verify and unpack Redis
        run: node tools/redis-ci.mjs prepare "$RUNNER_TEMP/postbox-redis"
      - name: Play the demo and screenshot every scene
        run: node tools/shoot-app.mjs
      # About 40 MB a run, kept 5 days. A run that broke partway uploads what it took.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/latest/app/
          retention-days: 5

  # A spec a pull request adds or edits runs ten times, with the events late, before it counts: one failure fails it.
  # tools/repeat-specs.mjs picks them. A spec reached only through a changed helper isn't repeated: the browser-specs
  # jobs run every spec twice already. On a later push, only the specs that push changed or brought in are: #387 changed the
  # helper every spec imports, and --only-changed ran all 38 specs ten times, 49 minutes, on each push.
  repeat:
    name: New and changed specs, ten times
    # Skipped where the pull request changes only docs: GitHub counts a skipped required check as passed. A later push
    # then repeats every spec the pull request adds or edits, since this job didn’t pass on the push before.
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    needs: [check, changes]
    timeout-minutes: 60
    # To read whether this job passed on the push before.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch and the push before too, to tell what the pull request and this push changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pick the specs to repeat
        id: pick
        run: |
          # The push before counts only where this job passed on it, as GitHub Actions (app 15368) reported it: a spec
          # it failed on, or never got to (a newer push cancels the run), runs ten times again. Where GitHub can't say,
          # the same.
          if [ -n "$BEFORE" ]; then
            passed=$(gh api -X GET "repos/$REPO/commits/$BEFORE/check-runs" -f check_name="$JOB" -f app_id=15368 \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length') || passed=0
            case "$passed" in '' | *[!0-9]* | 0) BEFORE= ;; esac
          fi
          specs=$(node tools/repeat-specs.mjs "origin/$BASE_REF" "$HEAD_SHA" "$BEFORE" | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          if [ -n "$specs" ]; then echo "Ten times each: $specs"; else echo "No spec to repeat: this push adds or edits none."; fi
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Empty on the first push and on a reopen: then every spec the pull request adds or edits.
          BEFORE: ${{ github.event.before }}
          JOB: New and changed specs, ten times
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.pick.outputs.specs != ''
        run: npm ci --ignore-scripts
      - name: Install Playwright’s Chromium
        if: steps.pick.outputs.specs != ''
        run: npx playwright install --with-deps chromium
      # The store’s Redis (tests/AGENTS.md, “The store’s Redis”): the runner has none, and tests never touch the network, so
      # Postbox’s pinned build comes from its own release through the code first start runs (tools/redis-ci.mjs): kept
      # only once its SHA-256 matches server/redis-build.mjs, unpacked in Node, and named in POSTBOX_REDIS_HOME. The
      # verified archive is cached under its pinned SHA-256, so a run downloads it only when the pin changes, and the
      # cached file is hashed again before it’s unpacked. The build came from ubuntu-24.04, so it runs on this image.
      - name: Read the Redis pin
        id: redis
        if: steps.pick.outputs.specs != ''
        run: node tools/redis-ci.mjs pin >> "$GITHUB_OUTPUT"
      - name: Cache the verified Redis archive
        uses: actions/cache@v4
        if: steps.pick.outputs.specs != ''
        with:
          path: ${{ runner.temp }}/postbox-redis/redis/${{ steps.redis.outputs.version }}/${{ steps.redis.outputs.asset }}
          key: redis-${{ steps.redis.outputs.target }}-${{ steps.redis.outputs.sha256 }}
      - name: Verify and unpack Redis
        if: steps.pick.outputs.specs != ''
        run: node tools/redis-ci.mjs prepare "$RUNNER_TEMP/postbox-redis"
      - name: New and changed specs, ten times
        if: steps.pick.outputs.specs != ''
        # Unquoted on purpose, one argument a spec: isSpec takes only plain names.
        run: npx playwright test $SPECS --repeat-each=10
        env:
          SPECS: ${{ steps.pick.outputs.specs }}
          POSTBOX_STREAM_LAG: 300
          # Its own report, beside the lag pass’s in the browser-specs jobs (#317).
          PB_REPORT: check-logs/lag/playwright-repeat.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-repeat
          path: check-logs/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-repeat
          path: test-results/
          retention-days: 14
