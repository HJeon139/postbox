# Runs Postbox’s checks on every pull request and every push to main. See designs/architecture.md, “Code quality”.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run still in progress. Keyed on the pull request’s number, not its branch’s
# name, so two forks' branches of the same name don't cancel each other. A push to main gets a group of its own.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, project rules and tests
    runs-on: ubuntu-latest
    # It takes under a minute; a hung step would otherwise hold the runner for GitHub’s default of 360.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: commit messages are checked against the base, and versions against tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install scripts are skipped: the checks need no native builds, and the optional narration
      # packages would otherwise download models and binaries they don't use here.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Conventional Commits, from v0.2.0 on: older commits on long-running branches keep their plain messages.
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        # Through the environment, not written into the script, as GitHub’s security guide says for context values.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/lint-commits.mjs "origin/$BASE_REF..HEAD" --since "$(git log -1 --format=%cI v0.2.0)"

  end-to-end:
    name: Demo in Chrome, with accessibility checks
    runs-on: ubuntu-latest
    needs: check
    # About 11 minutes on this runner (#287); each headless check also has check-all’s own 600 s limit.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Play the demo, screenshot every scene and run axe-core
        run: CHROME="$(command -v google-chrome)" node tools/shoot-app.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/latest/app/
          retention-days: 14
      # Every headless check (tools/check-*.mjs, tools/checks/*.mjs), in parallel, so a pull request’s own
      # checks run before review. It runs even when the screenshots fail, so a run shows both.
      # 4 at a time, measured on this runner (4 cores, 15 GB, PR #174): 1 at a time took 190 s, 2 took 100 s,
      # 4 took 72 s with the CPU still over half idle, and 6 or 8 saved under 5 s more.
      - name: Headless Chrome checks
        if: success() || failure()
        run: CHROME="$(command -v google-chrome)" npm run check:browser -- --jobs 4 --logs check-logs
      # The same checks with every event held back 300 ms, as a busy runner can, so a check that reads the page
      # before it has heard a change fails on the pull request that adds it, not now and then on main.
      - name: Headless Chrome checks, with the server’s events late
        if: success() || failure()
        run: CHROME="$(command -v google-chrome)" npm run check:browser -- --jobs 4 --lag 300 --logs check-logs/lag
      # The browser specs on Playwright Test (#303), on the Chromium build its version pins.
      - name: Install Playwright’s Chromium
        if: success() || failure()
        run: npx playwright install --with-deps chromium
      - name: Browser specs
        if: success() || failure()
        run: npx playwright test
      - name: Browser specs, with the server’s events late
        if: success() || failure()
        run: npx playwright test
        env:
          POSTBOX_STREAM_LAG: 300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: check-logs/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # A spec a pull request adds or edits runs ten times, with the events late, before it counts: one failure fails it.
  # tools/repeat-specs.mjs picks them. A spec reached only through a changed helper isn't repeated: the end-to-end job
  # runs every spec twice already. On a later push, only the specs that push changed are: #387 changed the helper every
  # spec imports, and --only-changed ran all 38 specs ten times, 49 minutes, on each push.
  repeat:
    name: New and changed specs, ten times
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    # To read whether this job passed on the push before.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch and the push before too, to tell what the pull request and this push changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pick the specs to repeat
        id: pick
        run: |
          # The push before counts only where this job passed on it: a spec it failed on, or never got to (a newer push
          # cancels the run), runs ten times again. Where GitHub can't say, the same.
          if [ -n "$BEFORE" ]; then
            passed=$(gh api -X GET "repos/$REPO/commits/$BEFORE/check-runs" -f check_name="$JOB" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
            [ "${passed:-0}" -gt 0 ] || BEFORE=
          fi
          specs=$(node tools/repeat-specs.mjs "origin/$BASE_REF" "$HEAD_SHA" "$BEFORE" | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          if [ -n "$specs" ]; then echo "Ten times each: $specs"; else echo "No spec to repeat: this push adds or edits none."; fi
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Empty on the first push and on a reopen: then every spec the pull request adds or edits.
          BEFORE: ${{ github.event.before }}
          JOB: New and changed specs, ten times
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.pick.outputs.specs != ''
        run: npm ci --ignore-scripts
      - name: Install Playwright’s Chromium
        if: steps.pick.outputs.specs != ''
        run: npx playwright install --with-deps chromium
      - name: New and changed specs, ten times
        if: steps.pick.outputs.specs != ''
        # Unquoted on purpose, one argument a spec: isSpec takes only plain names.
        run: npx playwright test $SPECS --repeat-each=10
        env:
          SPECS: ${{ steps.pick.outputs.specs }}
          POSTBOX_STREAM_LAG: 300
          # Its own report, beside the lag pass’s in the end-to-end job (#317).
          PB_REPORT: check-logs/lag/playwright-repeat.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-repeat
          path: check-logs/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-repeat
          path: test-results/
          retention-days: 14
