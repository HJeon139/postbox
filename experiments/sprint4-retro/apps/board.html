<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); }

  .s4-card[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .s4-card .s4-meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .s4-red { color: var(--alert); }
  .s4-green { color: var(--good); }
  .s4-bars { display: grid; gap: 4px; }
  .s4-bar { display: grid; grid-template-columns: 7em 1fr 3em; gap: 8px; align-items: center; font-size: 13px; }
  .s4-bar-track { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
  .s4-bar-track span { display: block; height: 100%; }
  .s4-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--dim); margin-top: 6px; }
  .s4-sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .s4-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .s4-list { max-height: 420px; overflow: auto; border-top: 1px solid var(--line); }
  .s4-row { display: grid; grid-template-columns: 4.5em 5.5em 1fr 8em; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .s4-row span { min-width: 0; overflow-wrap: anywhere; }
  .s4-detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 6px 0 0; }
  .s4-detail dt { color: var(--dim); }
  .s4-detail dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 760px) {
    .s4-cols { grid-template-columns: minmax(0, 1fr); }
    .s4-row { grid-template-columns: 4em minmax(0, 1fr); }

ddde8c0","draft":false,"base":"main","labels":["ready for integrator"],"review":"REVIEW_REQUIRED","merge":"UNKNOWN","ci":"green","owner":"lead-security"},{"n":1198,"t":"fix(review): old answered reviews show their comments, and old off-rule authors read as their agent's","head":"d323197c","draft":false,"base":"main","labels":[],"review":"REVIEW_REQUIRED","merge":"UNKNOWN","ci":"none","owner":"lead-host-install"},{"n":1195,"t":"fix(composer): a send that keeps failing with the stream open goes on being tried, and says so (#1193)","head":"cd56d304","draft":false,"base":"main","labels":["ready for integrator"],"review":"REVIEW_REQUIRED","merge":"UNKNOWN","ci":"green","owner":"lead-cards"},{"n":1194,"t":"fix(store)!: every snapshot is written as lines, so no state size stops a save or a start (#1180)","head":"d798d543","draft":false,"base":"main","labels":[],"review":"REVIEW_REQUIRED","merge":"UNKNOWN","ci":"red","owner":"lead-state"},{"n":1185,"t":"test(perf): the budget spec holds #1155’s target as a gate, at 1,000, 10,000 and 100,000 items (#1166)","head":"4f62dbfa","draft":true,"base":"main","labels":[],"review":"REVIEW_REQUIRED","merge":"UNKNOWN","ci":"red","owner":"lead-transcript"},{"n":1183,"t":"fix(codex): show when Codex refuses a turn for Postbox's server, and tell the next turn (#1162)","head":"0450595e","draft":false,"base":"main","labels":["integrator approved"],"review":"APPROVED","merge":"BLOCKED","ci":"running","owner":"lead-sweep"},{"n":1175,"t":"fix(remote): find a claude installed or updated after connecting, checked on the host","head":"7f443c79","draft":false,"base":"main","labels":["changes requested"],"review":"CHANGES_REQUESTED","merge":"UNKNOWN","ci":"red","owner":"lead-host-install"},{"n":1169,"t":"fix(queue): hold what waits for an agent after its reply fails, until the person acts","head":"f5ab5bae","draft":false,"base":"main","labels":["changes requested"],"review":"CHANGES_REQUESTED","merge":"UNKNOWN","ci":"green","owner":"lead-security"},{"n":1147,"t":"test(transcript): a resync with nothing changed keeps every item node and app frame (#987)","head":"b31e4326","draft":true,"base":"main","labels":[],"review":"REVIEW_REQUIRED","merge":"UNKNOWN","ci":"red","owner":"tester"}],"onMain":174,"notOnMain":[]};
const KINDS = ['fix', 'feat', 'test', 'perf', 'docs', 'ci'];
const COLOR = { fix: 'var(--s1)', feat: 'var(--s2)', test: 'var(--s3)', perf: 'var(--s4)', docs: 'var(--s5)', ci: 'var(--s6)', other: 'var(--s7)' };
const kindOf = (r) => (KINDS.includes(r.type) ? r.type : 'other');
const el = (tag, props, ...kids) => { const n = document.createElement(tag); Object.assign(n, props || {}); for (const k of kids) n.append(k); return n; };
const ready = DATA.open.filter((p) => p.labels.includes('ready for integrator') || p.labels.includes('integrator approved'));

document.getElementById('source').textContent =
  'Read from GitHub at ' + DATA.readAt.slice(0, 16).replace('T', ' ') + ' UTC. Every merged PR checked against origin/main at ' + DATA.main + ' with git merge-base: ' + DATA.onMain + ' of ' + DATA.merged.length + ' are on main.';
for (const t of [
  DATA.merged.length + ' PRs merged',
  DATA.merged.reduce((a, r) => a + r.fixes.length, 0) + ' issues closed by their PRs',
  '+' + DATA.merged.reduce((a, r) => a + r.add, 0).toLocaleString('en-US') + ' / −' + DATA.merged.reduce((a, r) => a + r.del, 0).toLocaleString('en-US') + ' lines',
  DATA.open.length + ' PRs still open',
  ready.length + ' labeled for you (limit 4)',
]) document.getElementById('facts').append(el('span', { className: 'pill', textContent: t }));

function bars(root, groups, max) {
  for (const [label, rows] of groups) {
    const track = el('div', { className: 's4-bar-track' });
    track.setAttribute('role', 'img');
    const parts = KINDS.concat('other').map((k) => [k, rows.filter((r) => kindOf(r) === k).length]).filter(([, n]) => n);
    track.setAttribute('aria-label', label + ': ' + rows.length + ' merged (' + parts.map(([k, n]) => n + ' ' + k).join(', ') + ')');
    const inner = el('div', { style: 'display:flex;height:100%;width:' + (100 * rows.length / max) + '%' });
    for (const [k, n] of parts) inner.append(el('span', { style: 'background:' + COLOR[k] + ';width:' + (100 * n / rows.length) + '%' }));
    track.append(inner);
    root.append(el('div', { className: 's4-bar' }, el('span', { textContent: label }), track, el('span', { className: 'mono small', textContent: String(rows.length) })));
  }
}
const days = {};
for (const r of DATA.merged) (days[r.at.slice(0, 10)] ??= []).push(r);
const dayGroups = Object.keys(days).sort().map((d) => [new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }), days[d]]);
bars(document.getElementById('days'), dayGroups, Math.max(...dayGroups.map(([, r]) => r.length)));
for (const k of KINDS.concat('other')) {
  const n = DATA.merged.filter((r) => kindOf(r) === k).length;
  if (n) document.getElementById('legend').append(el('span', {}, el('span', { className: 's4-sw', style: 'background:' + COLOR[k] }), k + ' ' + n));
}
const areas = {};
for (const r of DATA.merged) { const m = r.t.match(/^\w+!?\(([^)]+)\)/); (areas[m ? m[1] : '(none)'] ??= []).push(r); }
const areaGroups = Object.entries(areas).sort((a, b) => b[1].length - a[1].length).slice(0, 12);
bars(document.getElementById('areas'), areaGroups, areaGroups[0][1].length);

const COLS = [
  { id: 'ready', label: 'Labeled for you', test: (p) => ready.includes(p) },
  { id: 'stacked', label: 'Stacked on a PR below', test: (p) => p.base !== 'main' },
  { id: 'review', label: 'Needs review or CI', test: (p) => !p.draft && !p.labels.includes('changes requested') },
  { id: 'changes', label: 'Changes requested', test: (p) => p.labels.includes('changes requested') },
  { id: 'draft', label: 'Draft', test: (p) => p.draft },
];
const colOf = (p) => COLS.find((c) => c.test(p)).id;
let picked = null;
function renderOpen() {
  const root = document.getElementById('open');
  root.replaceChildren();
  for (const c of COLS) {
    const col = el('div', { className: 's4-col' }, el('h3', { textContent: c.label }));
    for (const p of DATA.open.filter((x) => colOf(x) === c.id)) {
      const card = el('button', { className: 's4-card', type: 'button' });
      card.setAttribute('aria-pressed', String(picked === p.n));
      const ci = el('span', { className: p.ci === 'red' ? 's4-red' : p.ci === 'green' ? 's4-green' : '', textContent: 'CI ' + p.ci });
      card.append(el('div', {}, el('strong', { textContent: '#' + p.n + ' ' })), el('div', { textContent: p.t.replace(/^\w+!?\([^)]*\)!?:\s*/, '') }), el('div', { className: 's4-meta' }, (p.owner || 'owner unknown') + ' · ', ci));
      card.addEventListener('click', () => { picked = p.n; renderOpen(); renderDetail(p); });
      col.append(card);
    }
    root.append(col);
  }
}
function renderDetail(p) {
  const box = document.getElementById('detail');
  box.replaceChildren(el('h3', { textContent: '#' + p.n + ': ' + p.t }));
  const dl = el('dl');
  for (const [k, v] of [['Head', p.head], ['Base', p.base], ['CI on this head', p.ci], ['Review', p.review.toLowerCase().replace('_', ' ')], ['Labels', p.labels.join(', ') || 'none'], ['GitHub merge state', p.merge.toLowerCase()], ['Owner', p.owner || 'unknown: every agent shares one GitHub account']]) dl.append(el('dt', { textContent: k }), el('dd', { className: k === 'Head' ? 'mono' : '', textContent: v }));
  const ask = el('button', { className: 'btn sm', type: 'button', textContent: 'Ask scrum-master about #' + p.n });
  const note = el('p', { className: 'dim small' });
  ask.addEventListener('click', async () => {
    try { await postbox.send('ask-pr', { pr: p.n }, 'The person asked about #' + p.n + ' on the sprint 4 board.'); note.textContent = 'Sent to scrum-master.'; }
    catch (err) { note.textContent = 'Couldn’t send: ' + (err && err.message ? err.message : err) + '. Try again in a minute.'; }
  });
  box.append(dl, el('div', { className: 's4-tools' }, ask), note);
}
renderOpen();

let kind = 'all';
const kinds = document.getElementById('kinds');
for (const k of ['all'].concat(KINDS)) {
  const b = el('button', { className: 'btn sm', type: 'button', textContent: k });
  b.setAttribute('aria-pressed', String(k === kind));
  b.addEventListener('click', () => { kind = k; for (const x of kinds.children) x.setAttribute('aria-pressed', String(x.textContent === k)); renderList(); });
  kinds.append(b);
}
const q = document.getElementById('q');
q.addEventListener('input', renderList);
function renderList() {
  const s = q.value.trim().toLowerCase();
  const rows = DATA.merged.filter((r) => (kind === 'all' || kindOf(r) === kind) && (!s || ('#' + r.n + ' ' + r.t + ' ' + (r.owner || '')).toLowerCase().includes(s)))
    .sort((a, b) => (a.at < b.at ? 1 : -1));
  document.getElementById('count').textContent = rows.length + ' shown. Owner is known for ' + DATA.merged.filter((r) => r.owner).length + ' of ' + DATA.merged.length + ', from the agents’ own reports.';
  const list = document.getElementById('list');
  list.replaceChildren();
  for (const r of rows) {
    const row = el('div', { className: 's4-row' });
    row.setAttribute('role', 'listitem');
    row.append(el('span', { className: 'mono', textContent: '#' + r.n }), el('span', { className: 'dim small s4-hide', textContent: r.at.slice(5, 16).replace('T', ' ') }), el('span', { textContent: r.t }), el('span', { className: 'dim small s4-hide', textContent: r.owner || '—' }));
    list.append(row);
  }
}
renderList();
