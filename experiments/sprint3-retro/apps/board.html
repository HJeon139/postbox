  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); }

  .sb-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .sb-head h1 { font-size: 16px; margin: 0; }
  .sb-facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .sb-lane { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; background: var(--panel); }
  .sb-lane-title { padding: 8px 10px; font-weight: 600; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .sb-cols { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 8px; padding: 8px; overflow-x: auto; }
  .sb-col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 0 0 6px; }
  .sb-card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--text); padding: 6px 8px; margin-bottom: 6px; font: inherit; cursor: pointer; }
  .sb-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sb-card[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .sb-card .sb-id { font-weight: 600; }
  .sb-card .sb-meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .sb-flag { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
  .sb-flag-alert { border-color: var(--alert); color: var(--alert); }
  .sb-detail { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
  .sb-detail h3 { margin: 0 0 6px; font-size: 15px; }
  .sb-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0; }
  .sb-detail dt { color: var(--dim); }
  .sb-detail dd { margin: 0; }
  .sb-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .sb-note { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .sb-col, .sb-card, .sb-detail, .sb-detail dd, .sb-lane-title span { min-width: 0; overflow-wrap: anywhere; }
  .sb-wrap, .sb-lane, .sb-detail { max-width: 100%; box-sizing: border-box; }
  .sb-card { box-sizing: border-box; }
  @media (max-width: 700px) {
    .sb-cols { grid-template-columns: minmax(0, 1fr); overflow-x: visible; }
    .sb-detail dl { grid-template-columns: minmax(0, 1fr); }
    .sb-detail dt { margin-top: 4px; }
  }
</style>
</head>

const byId = new Map(ITEMS.map(i => [i.id, i]));
let picked = null;

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  for (const k of kids) n.append(k);
  return n;
}

function renderFacts() {
  const facts = document.getElementById('facts');
  const waiting = ITEMS.filter(i => i.flags.includes('waiting on you')).length;
  for (const text of [`${ITEMS.length} cards`, `${ITEMS.filter(i => /^\d+$/.test(i.pts)).reduce((a, i) => a + Number(i.pts), 0)} points settled`, 'Sprint closed 6 Nov: 25 merged (+2 chores); 4 open PRs punted to sprint 4', 'findings after label: 1 (#742)', `${ITEMS.filter(i => i.col === 'progress').length} in progress`, `${waiting} waiting on you`, '#826 merged 03:09 UTC']) {
    facts.append(el('span', { className: 'pill', textContent: text }));
  }
}

function renderCard(item) {
  const card = el('button', { className: 'sb-card', type: 'button' });
  card.setAttribute('aria-pressed', String(picked === item.id));
  card.append(el('div', { className: 'sb-id', textContent: item.id }));
  card.append(el('div', { textContent: item.title }));
  const pts = item.pts === '?' ? 'points: card round open' : item.pts === 'in tool' ? 'inside the key-to-frame tool’s 8' : `${item.pts} pts`;
  const meta = el('div', { className: 'sb-meta', textContent: `${item.lead} · ${pts}` });
  for (const f of item.flags) {
    const alert = f === 'waiting on you';
    meta.append(el('span', { className: alert ? 'sb-flag sb-flag-alert' : 'sb-flag', textContent: f }));
  }
  card.append(meta);
  card.addEventListener('click', () => pick(item.id));
  return card;
}

function renderLanes() {
  const root = document.getElementById('lanes');
  root.replaceChildren();
  for (const lane of LANES) {
    const items = ITEMS.filter(i => i.lane === lane.id);
    const box = el('section', { className: 'sb-lane' });
    box.setAttribute('aria-label', lane.label);
    const title = el('div', { className: 'sb-lane-title' }, el('span', { textContent: lane.label }), el('span', { className: 'dim small', textContent: lane.goal }));
    const cols = el('div', { className: 'sb-cols' });
    for (const col of COLUMNS) {
      const c = el('div', { className: 'sb-col' }, el('h2', { textContent: col.label }));
      const inCol = items.filter(i => i.col === col.id);
      for (const item of inCol) c.append(renderCard(item));
      if (!inCol.length && col.id === 'progress') c.append(el('p', { className: 'dim small', textContent: 'Nothing yet: work starts once round 1’s plan is approved.' }));
      cols.append(c);
    }
    box.append(title, cols);
    root.append(box);
  }
}

function row(dl, label, value) {
  if (!value) return;
  dl.append(el('dt', { textContent: label }), el('dd', { textContent: value }));
}

function renderDetail() {
  const box = document.getElementById('detail');
  box.replaceChildren();
  const item = byId.get(picked);
  if (!item) {
    box.append(el('p', { className: 'dim', textContent: 'Pick a card to see its scope, owner, what it depends on and what’s next.' }));
    return;
  }
  box.append(el('h3', { textContent: `${item.id}: ${item.title}` }));
  const dl = el('dl');
  row(dl, 'Lead', item.lead);
  row(dl, 'Column', COLUMNS.find(c => c.id === item.col).label);
  row(dl, 'Scope', item.scope);
  row(dl, 'Next', item.next);
  row(dl, 'Depends on', item.depends);
  row(dl, 'Shared files', item.shared);
  row(dl, 'Points', item.pts === '?' ? 'card round open' : item.pts);
  row(dl, 'Note', item.last);
  box.append(dl);
  const ask = el('button', { className: 'btn sm', type: 'button', textContent: 'Ask scrum-master about this card' });
  ask.addEventListener('click', () => send('ask-card', item, `The person asked about ${item.id} on the sprint board.`));
  const cut = el('button', { className: 'btn sm ghost', type: 'button', textContent: 'Propose cutting this card' });
  cut.addEventListener('click', () => send('propose-cut', item, `The person proposed cutting ${item.id} from sprint 3.`));
  box.append(el('div', { className: 'sb-actions' }, ask, cut));
  box.append(el('p', { className: 'sb-note', id: 'sent' }));
}

async function send(action, item, summary) {
  const note = document.getElementById('sent');
  try {
    await postbox.send(action, { item: item.id, lane: item.lane }, summary);
    note.textContent = 'Sent to scrum-master.';
  } catch (err) {
    note.textContent = `Couldn’t send: ${err && err.message ? err.message : err}. Try again in a minute.`;
  }
}

function pick(id) {
  picked = picked === id ? null : id;
  postbox.saveState({ picked });
  renderLanes();
  renderDetail();
}

(async () => {
  await postbox.ready;
  const saved = await postbox.restoreState();
  if (saved && byId.has(saved.picked)) picked = saved.picked;
  renderFacts();
  renderLanes();
  renderDetail();
})();
</script>
</body>
</html>
