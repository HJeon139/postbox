<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New thread · Postbox</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="workbench.css">
<script type="module" src="mock.js"></script>
<style>
  .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 32px 0; }
  .welcome .hello { display: flex; align-items: center; gap: 14px; }
  .prompts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .prompt { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .prompt:hover { border-color: var(--accent); }
  .prompt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .prompt b { font-weight: 600; }
  @media (max-width: 767px) { .prompts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="btn icon sm ghost" href="01-overview.html" aria-label="Back to overview"><span class="i i-back"></span></a>
    <span class="crumbs"><span class="hide-sm">Book corpus</span><span class="i i-right hide-sm"></span><span class="title">New thread</span></span>
    <div class="present"><span class="who-chip"><pb-ring name="@librarian" state="idle" ctx="0" size="xs"></pb-ring><b>@librarian</b></span></div>
    <div class="top-actions">
      <button class="btn sm"><span class="g g-needs"></span><span class="hide-sm">Next that needs you</span><kbd>⌃J</kbd></button>
      <button class="btn icon sm ghost" aria-label="Settings"><span class="i i-gear"></span></button>
    </div>
  </header>
  <pb-rail project="corpus" active="new"></pb-rail>
  <div class="main">
    <pb-strip project="corpus" active="new"></pb-strip>
    <div class="transcript">
      <section class="col welcome" aria-labelledby="hello">
        <div class="hello">
          <pb-ring name="@librarian" state="idle" ctx="0" size="lg"></pb-ring>
          <div>
            <h1 class="title" id="hello">@librarian is ready</h1>
            <p class="dim">Ask about your books, or have me build a tool to explore them. I can search all 14 books in <code class="mono">~/books</code> by meaning and by exact words.</p>
          </div>
        </div>
        <div class="prompts" role="list" aria-label="Example prompts">
          <button class="prompt" role="listitem"><b>Build me an explorer for my corpus</b><span class="small dim">An interactive search across every book</span></button>
          <button class="prompt" role="listitem"><b>Explain lexical and semantic search</b><span class="small dim">With examples from your own books</span></button>
          <button class="prompt" role="listitem"><b>Review my corpus schema line by line</b><span class="small dim">Comment on the spec, then get a revision</span></button>
        </div>
      </section>
    </div>
    <div class="composer">
      <div class="col">
        <div class="composer-box">
          <button class="btn icon ghost" aria-label="Add a file or a new agent" aria-haspopup="menu"><span class="i i-plus"></span></button>
          <textarea rows="1" placeholder="Message @librarian" aria-label="Message"></textarea>
          <button class="btn send">Send</button>
        </div>
        <div class="hint"><span>Enter to send · Shift+Enter for a new line</span><span class="hide-sm">@ to wake an agent · + to add a file or an agent</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
